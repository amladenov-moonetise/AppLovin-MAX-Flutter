pluginManagement {
    def properties = new Properties()
    def local = file('local.properties')
    if (!local.exists()) throw new GradleException('Operator must provide android/local.properties with flutter.sdk and sdk.dir.')
    local.withInputStream { properties.load(it) }
    def flutterSdkPath = properties.getProperty('flutter.sdk')
    if (!flutterSdkPath) throw new GradleException('Missing flutter.sdk in local.properties')
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'
    id 'com.android.application' version '8.11.1' apply false
    id 'com.android.library' version '8.11.1' apply false
}
rootProject.name = 'MoonetiseAdapterCheckpointB2'
include ':app', ':replacement'
